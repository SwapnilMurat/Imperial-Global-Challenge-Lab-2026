services:
  ml:
    build:
      context: ./apps/ml
    container_name: recoverai-ml
    ports:
      - "8000:8000"

  api:
    image: node:20
    container_name: recoverai-api
    working_dir: /workspace
    command: sh -c "npm install && npm run dev:api"
    environment:
      - PORT=8787
      - ML_SERVICE_URL=http://ml:8000
    volumes:
      - ./:/workspace
    ports:
      - "8787:8787"
    depends_on:
      - ml

  web:
    image: node:20
    container_name: recoverai-web
    working_dir: /workspace
    command: sh -c "npm install && npm run dev:web -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://localhost:8787/api
    volumes:
      - ./:/workspace
    ports:
      - "5173:5173"
    depends_on:
      - api
